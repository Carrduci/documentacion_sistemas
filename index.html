        <script>
            (function () {
                // Quick Title Search Plugin for Docsify
                // Activates on Ctrl+Alt+M, searches current page headings in a modal with Fuse.js fuzzy matching.

                let Fuse = null;

                function loadFuse(callback) {
                    if (Fuse) {
                        callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src =
                        'https://cdn.jsdelivr.net/npm/fuse.js@latest/dist/fuse.min.js';
                    script.onload = () => {
                        Fuse = window.Fuse;
                        callback();
                    };
                    script.onerror = () => {
                        console.error('Failed to load Fuse.js');
                        callback(); // Proceed without Fuse, fallback to basic search
                    };
                    document.head.appendChild(script);
                }

                function initPlugin() {
                    if (window.__quickTitleSearchInit) return; // Prevent duplicate init
                    window.__quickTitleSearchInit = true;

                    let headings = [];
                    let fuse = null;
                    let modal = null;
                    let searchInput = null;
                    let resultsList = null;
                    let useFuse = false;

                    function collectHeadings() {
                        const section =
                            document.querySelector('.markdown-section');
                        if (!section) return [];
                        const selectors = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6']
                            .map((tag) => `.markdown-section ${tag}`)
                            .join(', ');
                        return Array.from(section.querySelectorAll(selectors))
                            .map((el, index) => ({
                                text: el.textContent.trim(),
                                el: el,
                                index: index
                            }))
                            .filter((h) => h.text.length > 0);
                    }

                    function createModal() {
                        if (modal) return;

                        modal = document.createElement('div');
                        modal.style.cssText = `
					        position: fixed;
					        top: 0;
					        left: 0;
					        width: 100%;
					        height: 100%;
					        background: rgba(0, 0, 0, 0.5);
					        display: flex;
					        align-items: center;
					        justify-content: center;
					        z-index: 9999;
					        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
					      `;

                        const box = document.createElement('div');
                        box.style.cssText = `
					        background: white;
					        border-radius: 8px;
					        width: 90%;
					        max-width: 500px;
					        max-height: 80%;
					        overflow: hidden;
					        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
					      `;

                        searchInput = document.createElement('input');
                        searchInput.type = 'text';
                        searchInput.placeholder = 'Buscar lo que sea';
                        searchInput.style.cssText = `
					        width: 100%;
					        padding: 12px;
					        border: none;
					        border-bottom: 1px solid #eee;
					        font-size: 16px;
					        outline: none;
					        box-sizing: border-box;
					      `;
                        searchInput.addEventListener('input', filterResults);

                        resultsList = document.createElement('ul');
                        resultsList.style.cssText = `
					        list-style: none;
					        margin: 0;
					        padding: 0;
					        max-height: 400px;
					        overflow-y: auto;
					      `;

                        const closeBtn = document.createElement('button');
                        closeBtn.textContent = 'Close';
                        closeBtn.style.cssText = `
					        position: absolute;
					        top: 8px;
					        right: 12px;
					        background: none;
					        border: none;
					        font-size: 14px;
					        cursor: pointer;
					        color: white;
					      `;
                        closeBtn.addEventListener('click', closeModal);

                        box.appendChild(closeBtn);
                        box.appendChild(searchInput);
                        box.appendChild(resultsList);
                        modal.appendChild(box);
                        document.body.appendChild(modal);

                        // Close on Escape
                        document.addEventListener('keydown', function (e) {
                            if (e.key === 'Escape' && modal) {
                                closeModal();
                            }
                        });
                    }

                    function fuzzyScoreFallback(query, text) {
                        if (query.length === 0) return 1;
                        const q = query.toLowerCase();
                        const t = text.toLowerCase();
                        const ql = q.length;
                        let matches = 0;
                        let j = 0;
                        for (let i = 0; i < t.length; i++) {
                            if (j < ql && t.charAt(i) === q.charAt(j)) {
                                j++;
                                matches = j;
                            }
                        }
                        const matchRatio = matches / ql;
                        const textRatio = matches / t.length;
                        return matchRatio * textRatio;
                    }

                    function filterResults() {
                        const query = searchInput.value;
                        let scored;

                        if (useFuse && fuse) {
                            const results = fuse.search(query);
                            scored = results.map((r) => ({
                                ...r.item,
                                score: r.score || 0
                            }));
                            if (query.length === 0) {
                                // For empty query, sort by original index
                                scored.sort((a, b) => a.index - b.index);
                            } else {
                                // Sort by score ascending (lower score is better in Fuse.js)
                                scored.sort((a, b) => a.score - b.score);
                            }
                        } else {
                            // Fallback
                            scored = headings
                                .map((h) => ({
                                    ...h,
                                    score: fuzzyScoreFallback(query, h.text)
                                }))
                                .filter(
                                    (s) =>
                                        s.score >= (query.length > 0 ? 0.6 : 0)
                                )
                                .sort((a, b) => {
                                    if (a.score !== b.score) {
                                        return b.score - a.score; // Higher score first
                                    }
                                    return a.index - b.index;
                                });
                        }

                        resultsList.innerHTML = '';

                        scored.forEach((h, index) => {
                            const li = document.createElement('li');
                            li.textContent = h.text;
                            li.style.cssText = `
					          padding: 12px;
					          border-bottom: 1px solid #eee;
					          cursor: pointer;
					          transition: background 0.2s;
					          background: ${index === 0 ? '#f0f8ff' : 'white'};
					        `;
                            li.addEventListener(
                                'mouseenter',
                                () => (li.style.background = '#f5f5f5')
                            );
                            li.addEventListener(
                                'mouseleave',
                                () =>
                                    (li.style.background =
                                        index === 0 ? '#f0f8ff' : 'white')
                            );
                            li.addEventListener('click', () => {
                                h.el.scrollIntoView({
                                    behavior: 'smooth',
                                    block: 'start'
                                });
                                closeModal();
                            });
                            resultsList.appendChild(li);
                        });

                        if (scored.length === 0 && query.length > 0) {
                            const li = document.createElement('li');
                            li.textContent = 'No headings found.';
                            li.style.cssText = 'padding: 12px; color: #999;';
                            resultsList.appendChild(li);
                        }
                    }

                    function openModal() {
                        headings = collectHeadings();
                        if (headings.length === 0) return;

                        loadFuse(() => {
                            if (Fuse) {
                                useFuse = true;
                                fuse = new Fuse(headings, {
                                    keys: ['text'],
                                    threshold: 0.4, // Adjust for fuzziness (0: exact, 1: loose)
                                    includeScore: true
                                });
                            }
                            createModal();
                            modal.style.display = 'flex';
                            searchInput.focus();
                            searchInput.value = '';
                            filterResults();
                        });
                    }

                    function closeModal() {
                        if (modal) {
                            modal.style.display = 'none';
                            searchInput.value = '';
                        }
                    }

                    // Keyboard shortcut
                    document.addEventListener('keydown', function (e) {
                        if (e.ctrlKey && e.altKey && e.key === 'm') {
                            e.preventDefault();
                            openModal();
                        }
                    });
                }

                // Integrate with Docsify if available
                if (window.Docsify) {
                    window.Docsify.plugins = window.Docsify.plugins || [];
                    window.Docsify.plugins.push(function (hook, vm) {
                        hook.init([], initPlugin);
                    });
                } else {
                    // Fallback: init after DOM ready
                    if (document.readyState === 'loading') {
                        document.addEventListener(
                            'DOMContentLoaded',
                            initPlugin
                        );
                    } else {
                        initPlugin();
                    }
                }
            })();
        </script>

                                }, 100);
                                next();
                            }
                        }
                    }
                ]
            };
        </script>

        <script>
            const HACER_TABLAS_DE_MOVIL = () => {
                setTimeout(() => {
                    const tables = document.querySelectorAll('table');
                    tables.forEach((table) => {
                        const rows = table.querySelectorAll('tr');
                        const headers = Array.from(
                            rows[0].querySelectorAll('th')
                        ).map((th) => th.textContent);

                        if (window.innerWidth <= 768) {
                            rows.forEach((row, index) => {
                                if (index === 0) return; // Skip header row
                                const card = document.createElement('div');
                                card.className = 'table-card';
                                const cells = row.querySelectorAll('td');
                                cells.forEach((cell, i) => {
                                    const label = document.createElement('div');
                                    label.className = 'card-label';
                                    label.textContent = headers[i];
                                    const value = document.createElement('div');
                                    value.className = 'card-value';
                                    value.innerHTML = cell.innerHTML;
                                    const sep = document.createElement('div');
                                    sep.className = 'card-sep';
                                    card.appendChild(label);
                                    card.appendChild(value);
                                    if (i < cells.length - 1) {
                                        card.appendChild(sep);
                                    }
                                });
                                table.parentNode.insertBefore(card, table);
                            });
                            table.style.display = 'none';
                        }
                    });
                }, 500);
            };
            document.addEventListener('DOMContentLoaded', () => {
                HACER_TABLAS_DE_MOVIL();
            });

            window.addEventListener('popstate', () => {
                HACER_TABLAS_DE_MOVIL();
            });

            window.addEventListener('beforeunload', () => {
                HACER_TABLAS_DE_MOVIL();
            });
        </script>
